[package]
name = "githubclaw"
version = "0.1.0"
edition = "2021"
description = "Near-autonomous AI agents that manage open-source projects end-to-end using GitHub as the single source of truth."
license = "MIT"
authors = ["Jeffrey <jeffrey@githubclaw.dev>"]
keywords = ["github", "ai", "agents", "automation", "webhook"]

[[bin]]
name = "githubclaw"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
which = "7"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
thiserror = "2"
regex = "1"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
axum-test = "16"
http-body-util = "0.1.3"
